<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon-Intel | Faction Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <header class="bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
      <div>
        <div class="flex items-center gap-3">
          <h1 id="faction-title" class="text-2xl font-bold text-white">Crimson Dragon</h1>
          <span class="px-2.5 py-0.5 text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded uppercase">
            Netlify Backend v2
          </span>
        </div>
        <p class="text-sm text-slate-400 mt-1">Dragon-Intel War & Roster Tracker</p>
      </div>

      <div class="flex flex-wrap items-center gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800">
        <button id="btn-crimson" onclick="switchFaction('55650', 'Crimson Dragon')" 
          class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow">
          Crimson Dragon (55650)
        </button>
        <button id="btn-blood" onclick="switchFaction('52872', 'Blood Dragon')" 
          class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-400 hover:text-white">
          Blood Dragon (52872)
        </button>
      </div>
    </header>

    <section class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row items-center gap-3">
      <div class="flex-1 w-full">
        <label class="block text-xs text-slate-400 mb-1 font-medium">Torn API Key (Public Access):</label>
        <input type="password" id="api-key-input" placeholder="Paste Public API Key here..." 
          class="w-full bg-slate-950 border border-slate-800 text-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:border-indigo-500" />
      </div>
      <button onclick="fetchData()" class="w-full md:w-auto mt-auto px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded transition-colors">
        Fetch Live Data
      </button>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-xl flex items-center justify-between shadow-xl">
        <div>
          <span class="text-xs uppercase text-slate-500 tracking-wider">Active Faction Target</span>
          <div id="active-faction-display" class="text-xl font-bold text-indigo-400 mt-1">Crimson Dragon (55650)</div>
        </div>
        <div id="roster-status" class="text-xs text-slate-400 text-right">Ready</div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col justify-between shadow-xl">
        <span class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Members Tracked</span>
        <div id="member-count" class="text-2xl font-bold font-mono text-emerald-400 mt-1">0</div>
      </div>
    </div>

    <section class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
      <div class="p-6 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-white">Live Member Roster</h2>
        <span class="text-xs text-slate-500">Click column headers to sort</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse select-none">
          <thead>
            <tr class="bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
              <th onclick="sortMembers('name')" class="py-3 px-6 cursor-pointer hover:text-white transition-colors">Name / ID <span id="indicator-name" class="text-slate-600 ml-1">↕</span></th>
              <th onclick="sortMembers('level')" class="py-3 px-6 cursor-pointer hover:text-white transition-colors">Level <span id="indicator-level" class="text-slate-600 ml-1">↕</span></th>
              <th class="py-3 px-6">Status</th>
              <th onclick="sortMembers('position')" class="py-3 px-6 cursor-pointer hover:text-white transition-colors">Position <span id="indicator-position" class="text-indigo-400 font-bold ml-1">▼</span></th>
            </tr>
          </thead>
          <tbody id="roster-table" class="divide-y divide-slate-800 text-sm">
            <tr>
              <td colspan="4" class="py-6 text-center text-slate-500">Enter your API key and click "Fetch Live Data".</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    let currentFactionId = '55650';
    let currentFactionName = 'Crimson Dragon';
    let allMembers = [];
    let currentSortColumn = 'position';
    let currentSortDirection = 'asc';

    // Strict validation list of allowed factions
    const ALLOWED_FACTIONS = ['55650', '52872'];

    function switchFaction(id, name) {
      if (!ALLOWED_FACTIONS.includes(id)) return;

      currentFactionId = id;
      currentFactionName = name;

      document.getElementById('faction-title').innerText = name;
      document.getElementById('active-faction-display').innerText = `${name} (${id})`;
      
      if (id === '55650') {
        document.getElementById('btn-crimson').className = 'px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow';
        document.getElementById('btn-blood').className = 'px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-400 hover:text-white';
      } else {
        document.getElementById('btn-crimson').className = 'px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-400 hover:text-white';
        document.getElementById('btn-blood').className = 'px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow';
      }

      // Only fetch if key is already entered
      const apiKey = document.getElementById('api-key-input').value.trim();
      if (apiKey) {
        fetchData();
      }
    }

    function getPositionWeight(position) {
      if (!position) return 99;
      const p = position.toLowerCase();
      if (p === 'leader' || (p.includes('leader') && !p.includes('co'))) return 1;
      if (p.includes('co-leader') || p.includes('coleader')) return 2;
      if (p.includes('officer') || p.includes('elder')) return 3;
      if (p.includes('member')) return 4;
      return 5;
    }

    function sortMembers(column) {
      if (allMembers.length === 0) return;

      if (currentSortColumn === column) {
        currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortColumn = column;
        currentSortDirection = 'asc';
      }

      allMembers.sort((a, b) => {
        let valA, valB;

        if (column === 'name') {
          valA = (a.name || '').toLowerCase();
          valB = (b.name || '').toLowerCase();
        } else if (column === 'level') {
          valA = Number(a.level) || 0;
          valB = Number(b.level) || 0;
        } else if (column === 'position') {
          valA = getPositionWeight(a.position);
          valB = getPositionWeight(b.position);
        }

        if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
        if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
        return 0;
      });

      updateSortIndicators();
      renderRoster();
    }

    function updateSortIndicators() {
      ['name', 'level', 'position'].forEach(col => {
        const el = document.getElementById(`indicator-${col}`);
        if (el) {
          if (currentSortColumn === col) {
            el.innerText = currentSortDirection === 'asc' ? '▲' : '▼';
            el.className = 'text-indigo-400 font-bold ml-1';
          } else {
            el.innerText = '↕';
            el.className = 'text-slate-600 ml-1';
          }
        }
      });
    }

    function renderRoster() {
      const tableBody = document.getElementById('roster-table');
      tableBody.innerHTML = '';

      if (allMembers.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-500">No member data returned.</td></tr>';
        return;
      }

      allMembers.forEach(m => {
        const name = m.name || `ID: ${m.id}`;
        const level = m.level || 'N/A';
        const position = m.position || 'Member';
        const statusState = m.status?.state || m.state || 'okay';

        let badgeClass = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        if (String(statusState).toLowerCase().includes('hospital')) badgeClass = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
        if (String(statusState).toLowerCase().includes('travel') || String(statusState).toLowerCase().includes('abroad')) badgeClass = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';

        const row = `
          <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="py-4 px-6 font-medium text-slate-200">${name} <span class="text-xs text-slate-500 font-mono">(#${m.id})</span></td>
            <td class="py-4 px-6 text-slate-400">${level}</td>
            <td class="py-4 px-6"><span class="px-2 py-1 text-xs font-semibold rounded-full uppercase ${badgeClass}">${statusState}</span></td>
            <td class="py-4 px-6 text-slate-400 text-xs">${position}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    async function fetchData() {
      const apiKey = document.getElementById('api-key-input').value.trim();
      const statusText = document.getElementById('roster-status');
      
      if (!apiKey) {
        statusText.innerText = "Please enter an API key.";
        return;
      }

      // Security check: Ensure selected faction is strictly Crimson or Blood Dragon
      if (!ALLOWED_FACTIONS.includes(currentFactionId)) {
        statusText.innerText = "Error: Invalid faction selection.";
        return;
      }

      statusText.innerText = "Querying via Netlify Serverless Backend...";

      try {
        const response = await fetch(`/.netlify/functions/proxy?faction=${currentFactionId}&key=${apiKey}`);
        const json = await response.json();

        if (json.error) {
          statusText.innerText = `API Error: ${json.error.message || 'Unknown'} (Code ${json.error.code || 'N/A'})`;
          return;
        }

        allMembers = json.members || json.faction?.members || (Array.isArray(json) ? json : []);
        document.getElementById('member-count').innerText = allMembers.length;

        // Default sort by position hierarchy on fetch (Leader first)
        currentSortColumn = 'position';
        currentSortDirection = 'asc';
        allMembers.sort((a, b) => getPositionWeight(a.position) - getPositionWeight(b.position));

        updateSortIndicators();
        renderRoster();

        statusText.innerText = `Successfully loaded data for ${currentFactionName}!`;

      } catch (err) {
        statusText.innerText = `Fetch Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
