<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faction Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-slate-900 border border-slate-800 p-6 rounded-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">Faction Intelligence Hub</h1>
                <p class="text-sm text-slate-400">War Tracking & Stats Portal</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded text-xs font-bold uppercase">Live</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl text-center">
                <h2 class="text-xl font-bold text-indigo-400">Crimson Dragon</h2>
                <p class="text-xs text-slate-400 mt-1">Main Faction Stats & War Status</p>
                <div class="mt-4 text-3xl font-mono text-emerald-400">ACTIVE</div>
            </div>
            
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl text-center">
                <h2 class="text-xl font-bold text-indigo-400">Sister Faction</h2>
                <p class="text-xs text-slate-400 mt-1">Sister Faction Stats & War Status</p>
                <div class="mt-4 text-3xl font-mono text-emerald-400">ACTIVE</div>
            </div>
        </div>
    </div>
</body>
</html>
